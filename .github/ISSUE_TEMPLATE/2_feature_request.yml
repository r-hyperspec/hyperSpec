name: Feature request
description: Suggest a new feature or improvement.
title: "[Feature]: "
labels: ["Type: enhancement :sparkles:", "Type: new :new:"]

body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature!
        Please **search existing issues** first to avoid duplicates.

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: >
        Is your feature request related to a problem or limitation? If so, describe it.
      placeholder: "I'm frustrated when ..."
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: >
        A clear and concise description of what you would like to happen.
        Include example R code if possible.
      render: r
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or workarounds you have considered.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other context, references, or examples that might help.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
