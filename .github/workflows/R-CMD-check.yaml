on:
  workflow_dispatch:
  push:
    branches: [main, master, develop, release, auto-update-test, update-gha-workflows]
  pull_request:
    branches: [main, master, develop, release]
  schedule:
    # (see https://crontab.guru)
    - cron: "5 3 * */2 WED"

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (R-${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macOS-latest,   r: 'release'}

          - {os: windows-latest, r: 'release'}

          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel'}

    permissions:
      contents: read

    env:
      R_KEEP_PKG_SOURCE: yes
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::devtools, any::remotes, local::.
          needs: check

      # roxygen2 7.3.x parser_setMethod calls methods::getMethod() which fails
      # in clean Rscript sessions for S4 methods on primitives like [[, [, $.
      # Pin to 7.2.3 for R release/oldrel.
      #
      # R-devel workaround:
      #   roxygen2 7.2.3 cannot run on R-devel 4.6.0: the binary is compiled
      #   against an older R ABI, and source-compiled 7.2.3 also references
      #   SET_GROWABLE_BIT which R 4.6.0 no longer exports from libR.so.
      #   roxygen2 7.3.3 loads fine on R-devel but crashes AFTER deleting
      #   NAMESPACE (parser_setMethod bug); setup-r-dependencies silently
      #   swallows that error, leaving NAMESPACE wiped.
      #   Fix: restore NAMESPACE + man/ from git after setup-r-dependencies,
      #   strip RoxygenNote from DESCRIPTION (so R CMD build won't re-invoke
      #   roxygen2 internally), and skip our own roxygenize step on devel.
      - name: "Install roxygen2 7.2.3"
        if: matrix.config.r != 'devel'
        run: |
          remotes::install_version("roxygen2", "7.2.3")
        shell: Rscript {0}

      - name: "Restore NAMESPACE and man/ from git (R-devel)"
        if: matrix.config.r == 'devel'
        shell: bash
        run: |
          git checkout HEAD -- NAMESPACE man/
          sed -i '/^RoxygenNote:/d' DESCRIPTION

      - name: Install dependencies (for R-devel)
        if: matrix.config.r == 'devel'
        run: |
          remotes::install_cran("vdiffr", type = "source", force = TRUE)
        shell: Rscript {0}

      - name: Install dependencies (for R-oldrel)
        if: matrix.config.r == '3.6'
        run: |
          remotes::install_version("rgl", "0.100.50")
        shell: Rscript {0}


      - name: Roxygenize
        if: matrix.config.r != 'devel'
        run: |
          devtools::document()
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true

      - name: Show R-CMD-check log as step summary
        if: always()
        shell: bash
        run: |
          find check -name '00check.log' -exec sh -c 'echo "### $1"; cat "$1"' _ {} \; >> $GITHUB_STEP_SUMMARY || true

