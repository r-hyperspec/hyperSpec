on:
  workflow_dispatch:
  push:
    branches: [main, master, develop, release, auto-update-test, update-gha-workflows]
  pull_request:
    branches: [main, master, develop, release]
  schedule:
    # (see https://crontab.guru)
    - cron: "5 3 * */2 WED"

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (R-${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macOS-latest,   r: 'release'}

          - {os: windows-latest, r: 'release'}

          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel'}

    permissions:
      contents: read

    env:
      R_KEEP_PKG_SOURCE: yes
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::devtools, any::remotes, local::.
          needs: check

      # roxygen2 7.3.x parser_setMethod calls methods::getMethod() which fails
      # in clean Rscript sessions for S4 methods on primitives like [[, [, $.
      # Pin to 7.2.3. On R-devel, install from source: the RSPM binary was
      # compiled against an older R and fails at runtime with:
      #   "undefined symbol: SET_GROWABLE_BIT"
      # Compiling from source uses the current R-devel headers (where
      # SET_GROWABLE_BIT is a static inline), so no external symbol dependency.
      - name: "Install roxygen2 7.2.3"
        if: matrix.config.r != 'devel'
        run: |
          remotes::install_version("roxygen2", "7.2.3")
        shell: Rscript {0}

      - name: "Install roxygen2 7.2.3 from source (R-devel)"
        if: matrix.config.r == 'devel'
        run: |
          remotes::install_version("roxygen2", "7.2.3", type = "source")
        shell: Rscript {0}

      - name: Install dependencies (for R-devel)
        if: matrix.config.r == 'devel'
        run: |
          remotes::install_cran("vdiffr", type = "source", force = TRUE)
        shell: Rscript {0}

      - name: Install dependencies (for R-oldrel)
        if: matrix.config.r == '3.6'
        run: |
          remotes::install_version("rgl", "0.100.50")
        shell: Rscript {0}

      - name: Session info
        run: |
          sessioninfo::session_info()
          sessionInfo()
        shell: Rscript {0}

      - name: Roxygenize
        run: |
          devtools::document()
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true

      - name: Show R-CMD-check log as step summary
        if: always()
        shell: bash
        run: |
          find check -name '00check.log' -exec sh -c 'echo "### $1"; cat "$1"' _ {} \; >> $GITHUB_STEP_SUMMARY || true

